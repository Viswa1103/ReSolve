<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReSolve</title>
    <link rel="stylesheet" href="log.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">



</head>

<body>
    <header>
        <div class="header-div">


            <div class="name">
                <h2>ReSolve<span style="color: #EEA63C;">.</span></h2>
            </div>

            <nav class="nav-links">
                <ul>
                    <li><a href="index.html" >DashBoard</a></li>
                    <li><a href="log.html" class="active">Log a problem</a></li>
                    <li><a href="problems.html">Problems</a></li>
                    <li><a href="insights.html">Insights</a></li>

                </ul>
            </nav>

            <div class="streak">
                <h3 id="header-streak">🔥 11 Days Streak</h3>
            </div>

            <button class="menu-btn">
                ☰
            </button>

            <aside class="sidebar">

                <button class="close-btn">&times;</button>
                <ul>
                    <li><a href="index.html" >DashBoard</a></li>
                    <li><a href="log.html" class="active ">Log a problem</a></li>
                    <li><a href="problems.html">Problems</a></li>
                    <li><a href="insights.html">Insights</a></li>

                </ul>

            </aside>
        </div>
    </header>

    <main>
        <h1>Log a problem</h1>
        <p class="subhead">Just incase to revisit again</p>

        <div class="form-container">
            <form class="form" >
                <div class="form-first-row">
                    <div class="Leetcode-number">
                        <label for="">Leetcode #</label>
                        <input type="text" placeholder="1" id="leetcode-number">
                    </div>
                    <div class="problem-name">
                        <label for="">Problem Name</label>
                        <input type="text" placeholder="Two Sum" id="problem-name">
                    </div>
                </div>
                <div class="form-second-row">
                    <div class="problem-patter">
                        <label for="">Pattern/Algorithm</label>
                        <select name="Options" id="pattern">
                            <option value="Two Pointers">Two Pointers</option>
                            <option value="Sliding Window">Sliding Window</option>
                            <option value="Binary Search">Binary Search</option>
                            <option value="Hashings">Hashing</option>
                            <option value="Stack">Stack</option>
                            <option value="Queue">Queue</option>
                            <option value="Linked List">Linked List</option>
                            <option value="Trees / BST">Trees / BST</option>
                            <option value="Graph (BFS/DFS)">Graph (BFS/DFS)</option>
                            <option value="Heap / Priority Queue">Heap / Priority Queue</option>
                            <option value="Dynamic Programming">Dynamic Programming</option>
                            <option value="Greedy">Greedy</option>
                            <option value="Backtracking">Backtracking</option>
                            <option value="Bit Manipulation">Bit Manipulation</option>
                            <option value="Union Find">Union Find</option>
                            <option value="Math">Math</option>
                            <option value="Prefix Sum">Prefix Sum</option>
                            <option value="Trie">Trie</option>
                            <option value="Interval">Interval</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="Difficulty">
                        <label for="">Difficulty</label>
                        <div class="Difficulty-btns">
                            <button type="button" id="easy-btn">Easy</button>
                            <button class="dif-btn-on" type="button" id="medium-btn">Medium</button>
                            <button type="button" id="hard-btn">Hard</button>
                        </div>
                    </div>

                </div>

                <div class="form-third-row">
                    <label for="">How did it go?</label>
                    <div class="solution-btns">
                        <button class="btn-on" type="button" id="solved-clean">Solved Clean</button>
                        <button type="button" id="needed-hint">Needed a hint</button>
                        <button type="button" id="read-solution">Read Solution</button>
                    </div>
                </div>

                <div class="form-fourth-row">
                    <label for="">LeetCode URL</label>
                    <input type="text" placeholder="https://leetcode.com/problems/to-lower-case/" id="problem-url">
                </div>
                <div class="form-fifth-row">
                    <label for="">Key insights / note</label>
                    <input type="textarea" placeholder="Use the toLowerCase() function" id="problem-insight">
                </div>

                <div class="form-sixth-row">
                    <button id="form-submit">Add to Deck</button>
                </div>

            </form>
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
